name: Self-Healing Nightly

# =============================================================================
# AUTOMATISIERTER NIGHTLY-RUN DES SELF-HEALING-LOOPS
#
# Ziel: Tägliche AI-basierte Reparatur von Scraper-Selektoren/Prompts.
# Trigger: Jeden Tag um 03:00 UTC + manuell via "Run workflow"-Button.
#
# Voraussetzungen (Repo-Secrets unter Settings → Secrets and variables → Actions):
#   - GEMINI_API_KEY               (Google AI Studio API Key, Free Tier ok)
#   - NEXT_PUBLIC_SUPABASE_URL     (Supabase Project URL)
#   - SUPABASE_SERVICE_ROLE_KEY    (Supabase Service Role Key)
#   - BFH_LLM_API_KEY              (eager-Initialisierung in scrape_utils.py)
#
# Hinweis Schedule: 03:00 UTC = 04:00 (Winter) / 05:00 (Sommer) Schweizer Zeit.
#
# Hinweis Free-Tier-Limits:
#   - Gemini 2.5 Flash Free Tier: 20 generate_content-Requests pro Tag.
#   - Wir limitieren auf 5 Errors pro Run (1-3 Requests pro Error, also max. 15).
#   - Bleibt sicher unter Tageslimit auch bei zusätzlichem manuellen Trigger.
# =============================================================================

on:
  schedule:
    # Jeden Tag um 03:00 UTC
    - cron: '0 3 * * *'

  # Erlaubt manuelles Triggern über die GitHub-Actions-Oberfläche
  workflow_dispatch:

jobs:
  run-self-healing:
    name: Run Self-Healing Loop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal-Set: was self_healing_loop.py + llm_provider.py + scrape_utils.py
          # tatsächlich importieren. scrape_utils.py initialisiert beim Import
          # einen BFH-LLM-Client (openai + langchain-openai), auch wenn der
          # Self-Healing-Loop selbst nur Gemini nutzt — deshalb beide drin.
          pip install supabase python-dotenv requests google-genai openai langchain-openai

      - name: Run self-healing loop
        env:
          GEMINI_API_KEY:               ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:     ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Der Self-Healing-Loop importiert via scrape_utils einen BFH-LLM-Client,
          # der beim Modul-Import eager initialisiert wird (auch wenn nicht genutzt).
          # Daher muss BFH_LLM_API_KEY hier verfügbar sein, damit der Import nicht abbricht.
          BFH_LLM_API_KEY:              ${{ secrets.BFH_LLM_API_KEY }}
        # --limit 5: Gemini Free Tier erlaubt nur 20 generate_content-Requests pro Tag.
        # Pro Error sind 1-3 Requests nötig (Retry bei 429). 5 Errors/Run = max. 15 Requests.
        # → Bleibt sicher unter dem Tageslimit, auch wenn manuell + nightly im selben Tag laufen.
        # Step-Timeout 8 Min: Hartes Limit. Falls Loop bei 429 hängt, wird Run terminiert
        # bevor der Workflow-Default (6h!) zuschlägt.
        timeout-minutes: 8
        run: |
          cd scraping/self-healing
          python self_healing_loop.py --limit 5

      - name: Summarize run
        if: always()
        run: |
          echo "Self-Healing-Loop run completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Check Supabase scrape_errors and scraper_registry for results."